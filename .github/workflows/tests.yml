name: Tests

# The unit tests plus a check of config/profile.yaml. In your own copy this
# doubles as a linter: a typo in the profile turns this run red.
on:
  push:
    paths: ["scripts/**", "tests/**", "config/**", "data/*.json", "data/*.csv", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 24.04 still offers Python 3.9, the oldest version supported here (it's
    # what macOS ships as /usr/bin/python3); newer runner images start at 3.10.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test-only dependency (the scripts themselves need nothing)
        run: pip install pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the profile
        run: python scripts/doctor.py --ci
